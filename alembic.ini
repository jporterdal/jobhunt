# Development only: `alembic revision --autogenerate -m "..."`, `alembic history`, etc.
# The database comes from $JOBHUNT_DB_URL (default sqlite:///data/jobhunt.db).
# At runtime, init_db() drives the same migrations in-process (src/jobhunt/migrate.py).

[alembic]
script_location = %(here)s/src/jobhunt/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
