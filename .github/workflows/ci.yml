name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python }}, SQLite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest

  test-postgres:
    name: test (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobhunt
          POSTGRES_PASSWORD: jobhunt
          POSTGRES_DB: jobhunt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobhunt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JOBHUNT_TEST_PG_URL: postgresql+psycopg://jobhunt:jobhunt@localhost:5432/jobhunt_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check

  privacy:
    # Patterns and file kinds over the tree and every commit. Personal values are checked locally, by the
    # pre-commit hook against the author's own database; CI has no database by design.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - run: jobhunt privacy-check --patterns-only --history

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install --global @fission-ai/openspec@1.13.0
      - run: openspec validate --all --strict
